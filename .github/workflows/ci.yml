name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: also publish the images to ghcr.io (a push to main always does)
        type: boolean
        default: false

jobs:
  native-x86_64:
    name: native x86-64 kernel + docker (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash          # -eo pipefail, so `| tee` cannot mask a failing test
    steps:
      - uses: actions/checkout@v5
      - name: Host
        run: |
          uname -mr
          cat /proc/sys/vm/overcommit_memory
          docker version --format 'docker {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'
      - name: Generate binaries
        run: python3 mktrue.py
      - name: Run natively on the runner kernel
        run: ./test.sh native | tee native.txt
      - name: Run as FROM-scratch images
        run: ./test.sh docker | tee docker.txt
      - name: Run as hand-built minimal OCI images
        run: ./test.sh oci | tee oci.txt
      - name: Run pause variants (alive, idle, stop behaviour)
        run: ./test.sh pause | tee pause.txt
      - name: Image size comparison
        run: ./compare-sizes.sh true-103 | tee sizes.txt
      - name: Header view (informational)
        run: for f in out/true-*; do echo "== $f"; readelf -h -l "$f" 2>&1 | grep -E 'Warning|Entry|LOAD|Type|readelf' || true; done
      - name: Summary
        if: always()
        run: |
          { echo "### native ($(uname -mr))"; echo '```'; cat native.txt; echo '```'
            echo "### docker run (FROM scratch)"; echo '```'; cat docker.txt; echo '```'
            echo "### docker run (minimal OCI image from mkimage.py)"; echo '```'; cat oci.txt; echo '```'
            echo "### pause variants"; echo '```'; cat pause.txt; echo '```'
            echo "### registry bytes, true-103"; echo '```'; cat sizes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish-ghcr:
    name: publish the minimal OCI images to ghcr.io
    needs: native-x86_64
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency: publish-ghcr
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Generate binaries
        run: python3 mktrue.py
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - name: Push every image, then pull each tag back and run it
        run: ./publish.sh "ghcr.io/${GITHUB_REPOSITORY,,}" | tee publish.txt
      - name: Summary
        if: always()
        run: |
          { echo "### ghcr.io/${GITHUB_REPOSITORY,,} ($(uname -mr))"; echo '```'; cat publish.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
